[project]
name = "miku-development"
version = "2.2.9"
description = "Development configuration for the Miku semantic material converter"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".git",
  ".mcp_tmp",
  ".codegraph",
  ".tools",
  ".validation",
  ".venv",
  "dist",
  "outputs",
  "Generated",
  "nodeoutput",
]

[tool.ruff.lint]
# Correctness-only baseline. Formatting/style expansion requires a separate,
# reviewed cleanup because the repository contains a large user worktree.
select = ["E9", "F63", "F7", "F82"]

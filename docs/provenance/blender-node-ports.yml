# ============================================================================
# M3: White Noise / Brick / Magic / Gabor — expanded native Shader Graph
# ============================================================================
# These four Blender 5.2 procedural textures are NOT implemented as new HLSL
# files. Each is expanded to a graph of native Shader Graph 17.4 nodes
# (GradientNoiseNode, VoronoiNode, FloorNode, ModuloNode, StepNode, LerpNode,
# AddNode, MultiplyNode, SubtractNode, ColorNode, CombineNode, SplitNode,
# SineNode, CosineNode) by BuildWhiteNoiseSource / BuildBrickSource /
# BuildMagicSource / BuildGaborSource in B2UShaderGraph17UrpBackend.cs.
# All algorithms are clean-room re-implementations derived from the Blender
# 5.2.0 LTS manual (blender-v5.2-release, commit e74f0a2b) plus public
# mathematics. Baked parity (Cycles) remains the pixel-exact reference;
# the live Shader Graph implementation is Approximate for visual review.
- blender_node: ShaderNodeTexWhiteNoise
  target_node: Miku / Blender 5 / Texture / White Noise
  blender_version: 5.2.0
  blender_tag: v5.2.0
  blender_commit: fbe6228777e7
  declaration_sources:
    - docs/provenance/_manual/blender-v5.2-release/tex_noise.html
  algorithm_sources:
    - Public math: Perlin-style gradient noise at maximum frequency
      (gradient noise at scale 0.01 approximates uncorrelated per-pixel
      white noise visually; no true hash node exists in Shader Graph 17.4)
    - tri-planar projection (XY / XZ / YZ averages) for 3D/4D dimensions
  source_spdx: []
  ported_files:
    - unity/Packages/com.miku.shaderconverter/Editor/ShaderGraph/B2UShaderGraph17UrpBackend.cs
  port_type: expanded-native
  translation: ExpandedNativeWhiteNoise
  modifications:
    - Tri-planar gradient noise approximation (no true hash node in SG 17.4)
    - Remap [0,1] -> [Min, Max] or Color1/Color2 Lerp for the output
    - Out-of-range clamp on dimension parameter to 1..4
  validation:
    - not-yet-validated

- blender_node: ShaderNodeTexBrick
  target_node: Miku / Blender 5 / Texture / Brick
  blender_version: 5.2.0
  blender_tag: v5.2.0
  blender_commit: fbe6228777e7
  declaration_sources:
    - docs/provenance/_manual/blender-v5.2-release/tex_brick.html
  algorithm_sources:
    - floor + modulo pattern for alternating-row offsets
    - step() mask for in-brick vs mortar regions
    - row-parity stand-in for per-brick hash tint
  source_spdx: []
  ported_files:
    - unity/Packages/com.miku.shaderconverter/Editor/ShaderGraph/B2UShaderGraph17UrpBackend.cs
  port_type: expanded-native
  translation: ExpandedNativeBrick
  modifications:
    - Row parity used as cheap stand-in for Blender's per-brick hash
    - Squash factor applied to row height only
  validation:
    - not-yet-validated

- blender_node: ShaderNodeTexMagic
  target_node: Miku / Blender 5 / Texture / Magic
  blender_version: 5.2.0
  blender_tag: v5.2.0
  blender_commit: fbe6228777e7
  declaration_sources:
    - docs/provenance/_manual/blender-v5.2-release/tex_magic.html
  algorithm_sources:
    - Chained Voronoi (Worley F1) octaves for cell clustering
    - Noise-driven distortion of input coordinates
  source_spdx: []
  ported_files:
    - unity/Packages/com.miku.shaderconverter/Editor/ShaderGraph/B2UShaderGraph17UrpBackend.cs
  port_type: expanded-native
  translation: ExpandedNativeMagic
  modifications:
    - Depth param maps to chained Voronoi octaves (depth 1..5)
    - Distortion: NoiseNode output multiplied by Distortion and added
  validation:
    - not-yet-validated

- blender_node: ShaderNodeTexGabor
  target_node: Miku / Blender 5 / Texture / Gabor
  blender_version: 5.2.0
  blender_tag: v5.2.0
  blender_commit: fbe6228777e7
  declaration_sources:
    - docs/provenance/_manual/blender-v5.2-release/tex_gabor.html
  algorithm_sources:
    - 2D rotation by Orientation radians applied to Vector
    - Aspect ratio applied to Y axis
    - Sinusoidal | Perlin noise carrier modulated by cosine (2*pi * x)
    - Weighted sum: w1*carrier + w2*cosine + w3
  source_spdx: []
  ported_files:
    - unity/Packages/com.miku.shaderconverter/Editor/ShaderGraph/B2UShaderGraph17UrpBackend.cs
  port_type: expanded-native
  translation: ExpandedNativeGabor
  modifications:
    - Orientation uses degrees converted via Mathf.Deg2Rad
    - Type maps: SINUSOIDAL -> GradientNoiseNode, PERLIN -> NoiseNode
  validation:
    - not-yet-validated


# Blender Node Ports Provenance Manifest
# =======================================
# Records the provenance of every Blender-compatible HLSL implementation.
#
# port_type values:
#   clean-room          — Independent implementation from public math references
#   deprecated-source-port  — retired direct-source route; not shipped
#   native-shader-graph — Uses Unity native Shader Graph node (no HLSL needed)
#   expanded-native     — Uses Unity native node(s) with expanded configuration
#
# validation values:
#   blender-ref-tested  — Validated against Blender 5.2.0 LTS headless reference output
#   unity-tested        — Validated in Unity 6000.4.5f1 Shader Graph
#   manual-reviewed     — Manually reviewed against Blender manual specification
#   not-yet-validated   — Implementation exists but validation is pending


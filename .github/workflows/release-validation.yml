name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Install development checks
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate release gates and reproducibility
        run: python tools/ci/run_checks.py --profile release
      - name: Build candidate artifacts
        run: python tools/release/build_release.py --output-dir artifacts
      - name: Upload candidates without publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miku-2.2.12-release-candidates
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

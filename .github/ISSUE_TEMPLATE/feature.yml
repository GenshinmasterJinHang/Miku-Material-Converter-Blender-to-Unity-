name: Feature request
description: Propose a compatible, testable improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user value
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution and alternatives
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility, schema, security, and licensing impact
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Test or fixture evidence
